<!DOCTYPE html>
<html>
<head>
  <title>Snake Game</title>
  <style>
    body { background: #111; color: white; text-align: center; }
    canvas { background: #000; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Snake</h1>
  <canvas id="game" width="400" height="400"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    let snake = [{x: 200, y: 200}];
    let dir = {x: 20, y: 0};
    let food = {x: 100, y: 100};

    function loop() {
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        food = {x: Math.floor(Math.random()*20)*20, y: Math.floor(Math.random()*20)*20};
      } else {
        snake.pop();
      }

      ctx.clearRect(0,0,400,400);
      ctx.fillStyle = "lime";
      snake.forEach(p => ctx.fillRect(p.x, p.y, 18, 18));
      ctx.fillStyle = "red";
      ctx.fillRect(food.x, food.y, 18, 18);
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowUp") dir = {x:0,y:-20};
      if (e.key === "ArrowDown") dir = {x:0,y:20};
      if (e.key === "ArrowLeft") dir = {x:-20,y:0};
      if (e.key === "ArrowRight") dir = {x:20,y:0};
    });

    setInterval(loop, 150);
  </script>
</body>
</html>
