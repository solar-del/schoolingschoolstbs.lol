<!DOCTYPE html>
<html>
<head>
  <title>Clicker Game</title>
  <style>
    body { background: #222; color: white; text-align: center; }
    button { padding: 20px 40px; font-size: 20px; }
  </style>
</head>
<body>
  <h1>Clicker</h1>
  <p>Clicks: <span id="count">0</span></p>
  <button onclick="clicks++ ; count.innerText = clicks">Click me</button>
  <script>
    let clicks = 0;
    const count = document.getElementById("count");
  </script>
</body>
</html>
